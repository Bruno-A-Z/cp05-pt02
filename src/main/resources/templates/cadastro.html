<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <title>Criar conta | Mercado Express</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"/>
    <link th:href="@{/css/app.css}" rel="stylesheet"/>
</head>
<body>
<main class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-8 col-lg-6">
            <div class="content-card p-4 p-lg-5">
                <div class="text-center mb-4">
                    <div class="display-5 mb-2">🛒</div>
                    <h1 class="h3 fw-bold">Criar conta</h1>
                    <p class="text-muted mb-0">Cadastre-se para acessar o catálogo</p>
                </div>

                <form th:action="@{/req/cadastro}" th:object="${form}" method="post" novalidate>
                    <div class="mb-3">
                        <label class="form-label fw-semibold">Nome completo</label>
                        <input type="text" class="form-control" th:field="*{nome}" th:errorclass="is-invalid"/>
                        <div class="invalid-feedback" th:errors="*{nome}"></div>
                    </div>

                    <div class="mb-3">
                        <label class="form-label fw-semibold">Usuário</label>
                        <input type="text" class="form-control" th:field="*{username}" th:errorclass="is-invalid"/>
                        <div class="invalid-feedback" th:errors="*{username}"></div>
                    </div>

                    <div class="mb-3">
                        <label class="form-label fw-semibold">E-mail</label>
                        <input type="email" class="form-control" th:field="*{email}" th:errorclass="is-invalid"/>
                        <div class="invalid-feedback" th:errors="*{email}"></div>
                    </div>

                    <div class="row g-3 mb-4">
                        <div class="col-md-6">
                            <label class="form-label fw-semibold">Senha</label>
                            <input type="password" class="form-control" th:field="*{senha}" th:errorclass="is-invalid"/>
                            <div class="invalid-feedback" th:errors="*{senha}"></div>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label fw-semibold">Confirmar senha</label>
                            <input type="password" class="form-control" th:field="*{confirmarSenha}" th:errorclass="is-invalid"/>
                            <div class="invalid-feedback" th:errors="*{confirmarSenha}"></div>
                        </div>
                    </div>

                    <button type="submit" class="btn btn-success btn-lg w-100">Cadastrar</button>
                </form>

                <div class="text-center mt-3">
                    <span class="text-muted">Já tem conta?</span>
                    <a th:href="@{/req/login}" class="fw-semibold text-decoration-none">Entrar</a>
                </div>
            </div>
        </div>
    </div>
</main>
</body>
</html>
