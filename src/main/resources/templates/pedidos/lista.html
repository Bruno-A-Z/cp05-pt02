<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <title>Pedidos | Mercado Express</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"/>
    <link th:href="@{/css/app.css}" rel="stylesheet"/>
</head>
<body>
<nav th:replace="~{fragments/layout :: nav}"></nav>

<main class="container py-4">
    <div class="d-flex justify-content-between align-items-center mb-3 flex-wrap gap-2">
        <h1 class="h3 mb-0" th:text="${titulo}">Pedidos</h1>
        <a th:if="${visaoAdmin}" class="btn btn-outline-primary" th:href="@{/admin/dashboard}">Ir ao dashboard</a>
    </div>
    <section class="content-card p-3 p-lg-4">
        <div class="table-responsive">
            <table class="table align-middle mb-0">
                <thead>
                <tr><th>Pedido</th><th th:if="${visaoAdmin}">Cliente</th><th>Data</th><th>Total</th><th>Status</th><th class="text-end"></th></tr>
                </thead>
                <tbody>
                <tr th:each="p : ${pedidos}">
                    <td class="fw-semibold" th:text="${'#' + p.id}">#1</td>
                    <td th:if="${visaoAdmin}" th:text="${p.usuario.username}">cliente</td>
                    <td th:text="${#temporals.format(p.dataCriacao, 'dd/MM/yyyy HH:mm')}">18/10/2026</td>
                    <td th:text="${'R$ ' + #numbers.formatDecimal(p.total, 1, 2)}">R$ 10,00</td>
                    <td>
                        <span class="badge rounded-pill"
                              th:classappend="${p.status.name() == 'APROVADO'} ? 'text-bg-success' : (${p.status.name() == 'PENDENTE'} ? 'text-bg-warning' : 'text-bg-danger')"
                              th:text="${p.status}">APROVADO</span>
                    </td>
                    <td class="text-end"><a class="btn btn-sm btn-outline-primary" th:href="@{/pedidos/{id}(id=${p.id})}">Detalhes</a></td>
                </tr>
                <tr th:if="${#lists.isEmpty(pedidos)}">
                    <td colspan="6" class="text-center py-5 text-muted">Nenhum pedido encontrado.</td>
                </tr>
                </tbody>
            </table>
        </div>
    </section>
</main>

<footer th:replace="~{fragments/layout :: footer}"></footer>
</body>
</html>
