<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <title>Entrar | Mercado Express</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"/>
    <link th:href="@{/css/app.css}" rel="stylesheet"/>
</head>
<body>
<main class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-6 col-lg-5">
            <div class="content-card p-4 p-lg-5">
                <div class="text-center mb-4">
                    <div class="display-5 mb-2">🛒</div>
                    <h1 class="h3 fw-bold">Mercado Express</h1>
                    <p class="text-muted mb-0">Entre na sua conta</p>
                </div>

                <div class="alert alert-danger" th:if="${param.error}">Usuário ou senha inválidos.</div>
                <div class="alert alert-success" th:if="${param.logout}">Sessão encerrada com sucesso.</div>
                <div class="alert alert-success" th:if="${param.cadastrado}">Cadastro realizado! Faça login para continuar.</div>

                <form th:action="@{/req/login}" method="post">
                    <div class="mb-3">
                        <label class="form-label fw-semibold">Usuário</label>
                        <input type="text" name="username" class="form-control form-control-lg" required autofocus/>
                    </div>

                    <div class="mb-4">
                        <label class="form-label fw-semibold">Senha</label>
                        <input type="password" name="password" class="form-control form-control-lg" required/>
                    </div>

                    <button type="submit" class="btn btn-success btn-lg w-100">Entrar</button>
                </form>

                <div class="text-center mt-3">
                    <span class="text-muted">Ainda não tem conta?</span>
                    <a th:href="@{/req/cadastro}" class="fw-semibold text-decoration-none">Cadastre-se</a>
                </div>
                <a class="btn btn-link w-100 mt-1 text-decoration-none" th:href="@{/}">Voltar ao início</a>
            </div>
        </div>
    </div>
</main>
</body>
</html>
