<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <title th:text="${modoEdicao} ? 'Editar produto' : 'Novo produto'">Produto</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"/>
    <link th:href="@{/css/app.css}" rel="stylesheet"/>
</head>
<body>
<nav th:replace="~{fragments/layout :: nav}"></nav>

<main class="container py-4">
    <div class="content-card p-4 p-lg-5" style="max-width: 760px; margin: 0 auto;">
        <div class="mb-4">
            <span class="badge badge-sector mb-2">Área administrativa</span>
            <h1 class="h2 mb-1" th:text="${modoEdicao} ? 'Editar produto' : 'Cadastrar novo produto'">Produto</h1>
            <p class="text-muted mb-0">Preencha os dados e salve diretamente no banco PostgreSQL.</p>
        </div>

        <form th:action="${modoEdicao} ? @{/web/itens/{id}/editar(id=${item.id})} : @{/web/itens}"
              th:object="${item}" method="post">

            <div class="row g-3">
                <div class="col-md-8">
                    <label class="form-label fw-semibold">Nome do produto</label>
                    <input type="text" class="form-control form-control-lg" th:field="*{name}" placeholder="Ex.: Sabão líquido" required/>
                </div>

                <div class="col-md-4">
                    <label class="form-label fw-semibold">Preço</label>
                    <div class="input-group input-group-lg">
                        <span class="input-group-text">R$</span>
                        <input type="number" step="0.01" min="0" class="form-control" th:field="*{price}" placeholder="0,00" required/>
                    </div>
                </div>

                <div class="col-md-6">
                    <label class="form-label fw-semibold">Tipo</label>
                    <input type="text" class="form-control" th:field="*{kind}" placeholder="Ex.: Limpeza" required/>
                </div>

                <div class="col-md-6">
                    <label class="form-label fw-semibold">Setor</label>
                    <select class="form-select" th:field="*{sector}" required>
                        <option value="">Selecione...</option>
                        <option th:each="s : ${sectors}" th:value="${s}" th:text="${s}"></option>
                    </select>
                </div>

                <div class="col-md-6">
                    <label class="form-label fw-semibold">Estoque (unidades)</label>
                    <input type="number" min="0" step="1" class="form-control" th:field="*{stock}" required/>
                </div>

                <div class="col-md-6">
                    <label class="form-label fw-semibold">Custo unitário</label>
                    <div class="input-group">
                        <span class="input-group-text">R$</span>
                        <input type="number" step="0.01" min="0" class="form-control" th:field="*{cost}" required/>
                    </div>
                </div>

                <div class="col-md-6">
                    <label class="form-label fw-semibold">Tamanho</label>
                    <select class="form-select" th:field="*{size}" required>
                        <option value="">Selecione...</option>
                        <option th:each="s : ${sizes}" th:value="${s}" th:text="${s}"></option>
                    </select>
                </div>
            </div>

            <hr class="my-4"/>

            <div class="d-flex gap-2 flex-wrap">
                <button type="submit" class="btn btn-success px-4" th:text="${modoEdicao} ? 'Salvar alterações' : 'Cadastrar produto'">Salvar</button>
                <a class="btn btn-outline-secondary" th:href="@{/web/itens}">Cancelar</a>
            </div>
        </form>
    </div>
</main>

<footer th:replace="~{fragments/layout :: footer}"></footer>
</body>
</html>
