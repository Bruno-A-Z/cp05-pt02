<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <title th:text="${item.name} + ' | Mercado Express'">Detalhes</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"/>
    <link th:href="@{/css/app.css}" rel="stylesheet"/>
</head>
<body>
<nav th:replace="~{fragments/layout :: nav}"></nav>

<main class="container py-4">
    <div class="content-card p-4 p-lg-5" style="max-width: 760px; margin: 0 auto;">
        <div class="d-flex justify-content-between align-items-start gap-3 mb-4">
            <div>
                <span class="badge badge-sector mb-2" th:text="${item.sector}">KITCHEN</span>
                <h1 class="h2 mb-1" th:text="${item.name}">Produto</h1>
                <p class="text-muted mb-0">Consulta detalhada realizada pelo Spring Data JPA.</p>
            </div>
            <div class="text-end">
                <div class="small text-muted">ID</div>
                <div class="fw-bold fs-4" th:text="${item.id}">1</div>
            </div>
        </div>

        <div class="table-responsive">
            <table class="table align-middle">
                <tbody>
                <tr><th style="width: 35%;">Nome</th><td th:text="${item.name}"></td></tr>
                <tr><th>Tipo</th><td th:text="${item.kind}"></td></tr>
                <tr><th>Setor</th><td th:text="${item.sector}"></td></tr>
                <tr><th>Tamanho</th><td th:text="${item.size}"></td></tr>
                <tr><th>Preço</th><td class="fw-bold" th:text="${'R$ ' + #numbers.formatDecimal(item.price, 1, 2)}"></td></tr>
                <tr><th>Estoque</th><td th:text="${(item.stock ?: 0) + ' unidades'}"></td></tr>
                <tr th:if="${admin}"><th>Custo</th><td th:text="${'R$ ' + #numbers.formatDecimal(item.cost ?: 0.0, 1, 2)}"></td></tr>
                </tbody>
            </table>
        </div>

        <div class="d-flex gap-2 flex-wrap mt-4">
            <a class="btn btn-outline-primary" th:href="@{/web/itens}">← Voltar</a>
            <form th:action="@{/carrinho/adicionar/{id}(id=${item.id})}" method="post" class="d-inline-flex gap-1" th:if="${(item.stock ?: 0) &gt; 0}">
                <input type="number" name="quantidade" value="1" min="1" th:max="${item.stock}" class="form-control" style="width:80px;"/>
                <button type="submit" class="btn btn-warning">🛒 Adicionar ao carrinho</button>
            </form>
            <a class="btn btn-outline-secondary" th:if="${admin}" th:href="@{/web/itens/{id}/editar(id=${item.id})}">Editar produto</a>
        </div>
    </div>
</main>

<footer th:replace="~{fragments/layout :: footer}"></footer>
</body>
</html>
