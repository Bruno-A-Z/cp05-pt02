<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <title>E-mails enviados | Mercado Express</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"/>
    <link th:href="@{/css/app.css}" rel="stylesheet"/>
</head>
<body>
<nav th:replace="~{fragments/layout :: nav}"></nav>

<main class="container py-4">
    <h1 class="h3 mb-1">E-mails enviados aos clientes</h1>
    <p class="text-muted">Controle gravado na tabela <code>TDS_Email_Log_Mercado</code>.</p>
    <section class="content-card p-3 p-lg-4">
        <div class="table-responsive">
            <table class="table align-middle mb-0">
                <thead><tr><th>ID</th><th>Data</th><th>Pedido</th><th>Destinatário</th><th>Assunto</th><th>Status</th></tr></thead>
                <tbody>
                <tr th:each="e : ${emails}">
                    <td th:text="${e.id}">1</td>
                    <td th:text="${#temporals.format(e.dataEnvio, 'dd/MM/yyyy HH:mm:ss')}">data</td>
                    <td><a th:if="${e.pedidoId != null}" th:href="@{/pedidos/{id}(id=${e.pedidoId})}" th:text="${'#' + e.pedidoId}">#1</a></td>
                    <td th:text="${e.destinatario}">email</td>
                    <td th:text="${e.assunto}">assunto</td>
                    <td>
                        <span class="badge rounded-pill"
                              th:classappend="${e.status.name() == 'ENVIADO'} ? 'text-bg-success' : (${e.status.name() == 'SIMULADO'} ? 'text-bg-secondary' : 'text-bg-danger')"
                              th:text="${e.status}">ENVIADO</span>
                        <div class="small text-danger" th:if="${e.erro != null}" th:text="${e.erro}"></div>
                    </td>
                </tr>
                <tr th:if="${#lists.isEmpty(emails)}"><td colspan="6" class="text-center py-5 text-muted">Nenhum e-mail registrado ainda.</td></tr>
                </tbody>
            </table>
        </div>
    </section>
</main>

<footer th:replace="~{fragments/layout :: footer}"></footer>
</body>
</html>
