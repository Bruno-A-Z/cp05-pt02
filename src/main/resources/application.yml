spring:
  application:
    name: amazin-mercado-express

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/mercadoexpress}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: ${DB_POOL_MAX:5}
      minimum-idle: ${DB_POOL_MIN:1}

  jpa:
    hibernate:
      ddl-auto: ${DDL_AUTO:update}
    show-sql: ${SHOW_SQL:false}
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

  hateoas:
    use-hal-as-default-json-media-type: true

  # ---- Mensageria: RabbitMQ (ou LavinMQ/CloudAMQP, que usam o mesmo protocolo AMQP) ----
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER:guest}
    password: ${RABBITMQ_PASSWORD:guest}
    virtual-host: ${RABBITMQ_VHOST:/}
    ssl:
      enabled: ${RABBITMQ_SSL:false}
    listener:
      simple:
        auto-startup: ${RABBITMQ_LISTENERS:true}
        default-requeue-rejected: false   # após as tentativas, a mensagem vai para a DLQ
        retry:
          enabled: true
          max-attempts: 3
          initial-interval: 1s
          multiplier: 2

  # ---- E-mail (SMTP). Para teste local use o Mailpit do docker-compose (porta 1025) ----
  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}
    username: ${MAIL_USER:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail.smtp.auth: ${MAIL_AUTH:false}
      mail.smtp.starttls.enable: ${MAIL_STARTTLS:false}

server:
  port: ${PORT:8082}
  # Necessário atrás do proxy do Render (mantém https nos redirects)
  forward-headers-strategy: framework

# Usuário ADMIN criado automaticamente na primeira execução
app:
  security:
    admin:
      username: ${ADMIN_USERNAME:admin}
      password: ${ADMIN_PASSWORD:admin123}

# ---- Mercado Express (Parte 2) ----
app.mail:
  enabled: ${MAIL_ENABLED:false}      # false = e-mail apenas registrado no banco (status SIMULADO)
  from: ${MAIL_FROM:no-reply@mercadoexpress.com}

# ---- Banco Tranquilo ----
banco:
  # Por padrão aponta para a API do próprio projeto; troque para usar um Banco Tranquilo externo.
  api:
    url: ${BANCO_API_URL:http://localhost:${server.port}/banco-tranquilo/api}
    key: ${BANCO_API_KEY:banco-tranquilo-key}
  limite-transacao: ${BANCO_LIMITE:5000}
